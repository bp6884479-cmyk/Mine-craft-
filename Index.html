if(t.clientX<VW()*.45&&!st){st={id:t.identifier,x:t.clientX,y:t.clientY};const j=$('#jb');j.style.display='block';j.style.left=st.x+'px';j.style.top=st.y+'px'}else if(!lk){const L={id:t.identifier,x:t.clientX,y:t.clientY,sx:t.clientX,sy:t.clientY,mv:0,hold:0,t0:performance.now(),ndc:[t.clientX/VW()*2-1,-(t.clientY/VH())*2+1]};lk=L;setTimeout(()=>{if(lk===L&&!L.mv&&!invOpen&&started&&!paused&&!dead){L.hold=1;RS=L.ndc;brk=true}},230)}}},{passive:false});

else if(lk&&t.identifier==lk.id){if(!lk.hold&&Math.hypot(t.clientX-lk.sx,t.clientY-lk.sy)>14)lk.mv=1;if(lk.hold)RS=[t.clientX/VW()*2-1,-(t.clientY/VH())*2+1];else if(lk.mv){P.yaw-=(t.clientX-lk.x)*.0052;P.pit=clamp(P.pit-(t.clientY-lk.y)*.0052,-1.55,1.55)}lk.x=t.clientX;lk.y=t.clientY}}if(!invOpen)e.preventDefault()},{passive:false});
const te=e0=>{const e=cv(e0);for(const t of e.changedTouches){if(st&&t.identifier==st.id){st=null;mv.x=mv.z=0;jbRest()}if(lk&&t.identifier==lk.id){if(lk.hold){brk=false;RS=null}else if(!lk.mv&&!invOpen&&started&&!dead&&!paused){RS=lk.ndc;use();RS=null}lk=null}}};

/* ---------- vehicles: board / leave button ---------- */
function nearVeh(){if(riding||!started)return null;for(const t of TRN)if(Math.hypot(t.x-P.x,t.z-P.z)<4.5&&Math.abs(t.y-P.y)<3.5)return['t',t];if(boat&&Math.hypot(boat.x-P.x,boat.z-P.z)<3.5)return['b'];if(cart&&!cart.train&&Math.hypot(cart.x-P.x,cart.z-P.z)<3&&!(S[sel]&&S[sel].id==120))return['c'];return null}
function boardNear(){const v=nearVeh();if(!v)return 0;
if(v[0]=='t'){const t=v[1];cart=t;riding=2;t.v=0;t.fh=0;P.yaw=Math.atan2(-t.dx,-t.dz);P.pit=0;toast('🚆 Train me baith gaye! W=aage, S=brake/ulti, A/D=mod. Utarne ke liye Leave dabao')}
else if(v[0]=='b'){riding=1;toast('🚣 Boat! Utarne ke liye Leave dabao')}
else{riding=2;toast('🚃 Minecart! Utarne ke liye Leave dabao')}return 1}
function leaveVeh(){const c=cart;
if(riding==2&&c){const sx=-c.dz,sz=c.dx;c.v=0;P.x=c.x+sx*2;P.z=c.z+sz*2;P.y=c.y+.2;P.vy=0;
if(coll(P.x,P.y,P.z)){P.x=c.x-sx*2;P.z=c.z-sz*2;if(coll(P.x,P.y,P.z)){P.x=c.x;P.z=c.z;P.y=c.y+1.2}}}
else if(riding==1&&boat){P.y=boat.wy+.3;P.vy=7}
riding=0;tz=0;P.vx=P.vz=0;toast('Utar gaye')}
let tz=0;hold('#bg',()=>tz=-1,()=>tz=0);hold('#bk',()=>tz=1,()=>tz=0);
function vehToggle(){if(!started||dead||paused||invOpen)return;if(riding)leaveVeh();else boardNear()}
function vehBtn(){const b=$('#bt'),dr=started&&!dead&&!paused&&!invOpen&&riding==2;$('#bg').style.display=$('#bk').style.display=dr?'flex':'none';$('#bj').style.display=dr?'none':'';let txt='';
if(started&&!dead&&!paused&&!invOpen){if(riding)txt='🚪 Leave';else{const v=nearVeh();if(v)txt=v[0]=='t'?'🚆 Board Train':v[0]=='b'?'🚣 Board Boat':'🚃 Board Minecart'}}
if(!txt){b.style.display='none';return}
if(!tc)txt+=' [F]';b.style.display='flex';if(b.textContent!=txt)b.textContent=txt}
$('#bt').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();vehToggle()});
addEventListener('keydown',e=>{if(e.code=='KeyF')vehToggle()});

let SV=null;
function init(){gfx(2);waterAnim(0);
const v0=vil(0,0);let sx,sz;if(v0){sx=v0.x+8;sz=v0.z}else{const f=findLand(0,0);sx=f[0];sz=f[1]}
P.x=sx+.5;P.z=sz+.5;P.y=(v0?v0.y:th(sx,sz))+2;spawn=[P.x,P.y,P.z];if(SV&&SV.p){ED=SV.ed||{};spawn=SV.sp||spawn;P.x=SV.p[0];P.y=SV.p[1]+.3;P.z=SV.p[2];P.yaw=SV.p[3]||0;tod=SV.t||tod;hp=SV.hp||20;food=SV.food==null?20:SV.food;(SV.ch||[]).forEach(([k,v])=>CH.set(k,v))}
if(!v0){const hh=th(Math.floor(P.x),Math.floor(P.z));if(hh<=SEA+1||hh>SEA+14){const[lx,lz]=findLand(P.x,P.z);P.x=lx+.5;P.z=lz+.5;P.y=th(lx,lz)+2;P.vy=0}const hs=th(Math.floor(spawn[0]),Math.floor(spawn[2]));if(hs<=SEA+1||hs>SEA+14)spawn=[P.x,P.y,P.z]}
for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++)mk((Math.floor(P.x)>>4)+a,(Math.floor(P.z)>>4)+b);for(const c of chunks.values())mesh(c);
if(SV&&SV.s){SV.s.forEach((s,i)=>S[i]=s);sel=SV.sel|0}else{add(107,1);add(108,1);add(109,1);add(16,8);add(106,6);add(7,8)}
for(let i=0;i<14;i++)mkMob([0,1,4,5,6][i%5],P.x+Math.random()*50-25,P.z+Math.random()*50-25);
ui();$('#ld').textContent='World ready!'}

function loop(now){requestAnimationFrame(loop);if(!booted){last=now;return}const raw=now-last,dt=Math.min(.05,raw/1000);last=now;frame++;if(started&&!paused&&raw<500){fpsE+=(raw-fpsE)*.04;if(fpsE>38){if(++lowN>120&&GQ>0&&autoQ){lowN=0;fpsE=16;gfx(GQ-1);toast('⚡ Performance mode: graphics kam ki gayi')}}else lowN=0}
if(started&&!dead&&!paused){physics(dt);if(!invOpen)mine(dt);else{brk=false}
stream();updMobs(dt);updP(dt);
for(let i=DS.length-1;i>=0;i--){const q=DS[i];q.t+=dt*4.2;const p=Math.min(1,q.t);q.g.rotation.y=(q.op?p:1-p)*1.5708;if(p>=1){sc.remove(q.g);DS.splice(i,1)}}
if(fr){const[a,b]=SM[fr.i];if(!cnt(a)||fr.left<=0){fr=null;if(invOpen)ui()}else{fr.t+=dt;const fb=$('#fb');if(fb)fb.style.width=Math.min(100,fr.t/1.2*100)+'%';if(fr.t>=1.2){fr.t=0;if(fuel<=0){const f=FUEL.find(f=>cnt(f[0]));if(f){rem(f[0],1);fuel=f[1]}else{toast('No fuel!');fr=null}}if(fr&&fuel>0){rem(a,1);fuel--;add(b,1);fr.left--;ui()}}}}if(night&&frame%100==0&&mobs.filter(m=>m.type==2).length<7){const a=Math.random()*6.28,r=14+Math.random()*12;mkZ(P.x+Math.cos(a)*r,P.z+Math.sin(a)*r)}
hunger+=dt;if(hunger>28){hunger=0;food=Math.max(0,food-1);ui()}regen+=dt;if(regen>3){regen=0;if(food>14&&hp<20)hp++;else if(food<=0)hp--;ui();if(hp<=0)over()}
swing=Math.max(0,swing-dt*4);{const k=Math.min(1,dt*20),bob=(P.g&&(mv.x||mv.z||K.KeyW||K.KeyS||K.KeyA||K.KeyD))?Math.sin(now*.012)*.012:Math.sin(now*.003)*.004;hand.rotation.x+=(-swing*.9-hand.rotation.x)*k;hand.rotation.y+=(swing*.4-hand.rotation.y)*k;hand.rotation.z+=(-swing*.3-hand.rotation.z)*k;hand.position.x+=(.32-swing*.05-hand.position.x)*k;hand.position.y+=(-.3-swing*.06+bob-hand.position.y)*k;hand.position.z+=(-.55-hand.position.z)*k}
if(eatT>0){eatT-=dt;hand.position.set(.05,-.12+Math.sin(now*.03)*.03,-.38);hand.rotation.set(-.6,0,Math.sin(now*.03)*.2);if(eatT<=0){const s=S[eatS];if(s&&B[s.id].fd){food=Math.min(20,food+B[s.id].fd);s.n--;if(!s.n)S[eatS]=null;toast('Yum! 🍗');snd(500,.08,'sine');ui()}}}
lacc+=dt;if(lacc>.15){lacc=0;lights(now)}}
wacc+=dt;if(wacc>.12){wacc=0;waterAnim(now/250)}
env(started?dt:dt*.2);if(!started){cam.position.set(P.x,P.y+8,P.z);P.yaw+=dt*.1;cam.rotation.set(-.2,P.yaw,0);stream()}
if(frame%5==0)vehBtn();R_.render(sc,cam)}
