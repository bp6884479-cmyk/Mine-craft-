  for(let i=PV.length-1;i>=0;i--){const q=PV[i];if(chunks.has((Math.floor(q.x)>>4)+','+(Math.floor(q.z)>>4))){spawn(3,q.x,q.z,q.h);PV.splice(i,1)}}
  const RV2=(RD*16)*(RD*16);
  for(let i=mobs.length-1;i>=0;i--){
    const m=mobs[i];
    if(m.dead){mobs.splice(i,1);continue}
    const dx=P.x-m.x,dz=P.z-m.z,D2=dx*dx+dz*dz;
    if(D2>4900){sc.remove(m.g);mobs.splice(i,1);continue}
    m.acc=(m.acc||0)+dt;
    if(D2>1600&&((frame+i)&3))continue;
    const d=Math.min(m.acc,.2);m.acc=0;
    if(m.type==7){fishStep(m,d);m.g.visible=D2<RV2;continue}
    m.mvf=0;kb(m,d);
    m.hurtT=Math.max(0,m.hurtT-d);m.g.scale.y=1-.12*Math.min(1,m.hurtT/.3);if(m.type!=9)m.g.scale.x=m.g.scale.z=1;
    const L=Math.sqrt(D2);
    if(m.type==3)villager(m,d,L);else if(HS.has(m.type))hostile(m,d,L,i);else animal(m,d,L);
    if(m.dead)continue;
    if(m.ty>=m.y-.01){const g0=gnd2(m.x,m.y,m.z,m.ch);if(g0!==null&&g0<m.y-.1)m.ty=g0}
    m.y+=(m.ty-m.y)*Math.min(1,d*(m.ty<m.y?14:10));
    let da=m.ta-m.a;da=((da+PI)%(2*PI)+2*PI)%(2*PI)-PI;m.a+=da*Math.min(1,d*9);
    m.g.position.set(m.x,m.y,m.z);m.g.rotation.y=m.a;
    m.g.visible=!m.in&&D2<RV2;
    if(m.g.visible)anim(m,d);}
  updArrows(dt);spawnTick(dt)};

/* ---------------- 13. COMBAT / INTERACTION ---------------- */
const DV=new THREE.Vector3(),OV=new THREE.Vector3();
function aimDir(){if(RS){cam.updateMatrixWorld();DV.set(RS[0],RS[1],.5).unproject(cam).sub(cam.position).normalize()}else cam.getWorldDirection(DV);return DV}
function aimAt(m,reach){
  const d=aimDir(),o=cam.position;let best=1e9;
  for(let k=.25;k<=.95;k+=.35){const px_=m.x-o.x,py=m.y+m.H*k-o.y,pz=m.z-o.z,t=px_*d.x+py*d.y+pz*d.z;
    if(t<0||t>reach)continue;const qx=px_-d.x*t,qy=py-d.y*t,qz=pz-d.z*t,pe=Math.hypot(qx,qy,qz);if(pe<(m.R||.45)+.15&&t<best)best=t}
  return best<1e9?best:-1}
mobHit=function(maxT){
  if(cd>0)return 0;
  const reach=Math.min(5,maxT+1.8);let tgt=null,bt=1e9;
  for(const m of mobs){if(m.type==3||m.type==4||m.type==5||m.in||m.dead)continue;const t=aimAt(m,reach);if(t>=0&&t<bt){bt=t;tgt=m}}
  if(!tgt)return 0;
  const m=tgt;cd=.3;swing=1;
  const it_=S[sel];
  if(m.type==1&&it_&&it_.id==104){if(!m.sh){m.sh=1;add(23,1+(Math.random()*3|0));toast('Wool mila!');m.wool.forEach(w=>w.material=SHEARED);wear();ui();pick(m.x,m.y+.6,m.z)}return 1}
  const sw=it_&&B[it_.id].sw;if(sw)wear();
  m.hp-=sw?(it_.e?6:4):2;m.hurtT=.3;snd(200,.06,'square',.1);
  const a=ang(m.x-P.x,m.z-P.z),kbs=m.type==11?2:m.type==6?2.5:6;m.kbx=Math.sin(a)*kbs;m.kbz=Math.cos(a)*kbs;
  burst(m.x,m.y+m.H*.5,m.z,[220,40,40],6);
  if(m.type==10)m.prov=1;
  else if(m.type==11){m.agro=1;if(Math.random()<.4)tele(m,P.x,P.z,6)}
  else if(!HS.has(m.type)){m.pan=3}
  if(m.hp<=0){kill(m,1);drops(m)}
  return 1};
const _use=use;
use=function(){
  if(started&&!invOpen&&!dead&&!paused&&!riding){
    for(const m of mobs)if(m.type==3&&!m.in&&!m.dead&&aimAt(m,4)>=0){
      const p=PROF[m.pi];m.talk=3;m.chat=0;toast(p.n+': '+p.say[Math.random()*p.say.length|0]);snd(190,.18,'triangle',.06);swing=1;return}}
  _use()};

/* ---------------- 14. RESET ANY OLD-STYLE MOBS, THEN GO ---------------- */
for(const m of mobs)sc.remove(m.g);mobs.length=0;
if(booted)for(let i=0;i<14;i++)spawn([0,1,12,13,4,5,6,14][i%8],P.x+Math.random()*50-25,P.z+Math.random()*50-25);
console.log('Block World upgrade loaded');
})();
